# Started by hand from the Actions tab. Calls the real API, so it needs the
# BRIGHTDATA_API_TOKEN secret and spends one credit per post.
#
# Not on push: that would spend money per commit, and a slow day at the API
# would show up as a failed build on your repository.
name: Scrape Instagram for real (start it yourself, uses your API token)

run-name: Scrape ${{ inputs.handles }}, ${{ inputs.limit }} posts each

on:
  workflow_dispatch:
    inputs:
      handles:
        description: Instagram handles, separated by spaces. No @ needed.
        default: nasa natgeo
      limit:
        description: How many recent posts to fetch for each handle
        default: "2"

permissions:
  contents: read

jobs:
  scrape:
    name: Fetch the posts and attach them to this run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install -e .
      - name: Fetch the posts from Instagram
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          HANDLES: ${{ inputs.handles }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -n "$BRIGHTDATA_API_TOKEN" || {
            echo "No API token. Add BRIGHTDATA_API_TOKEN under" >&2
            echo "Settings, Secrets and variables, Actions, then start this again." >&2
            exit 1
          }
          python -m ig_scraper $HANDLES --limit "$LIMIT"
      - name: Show what was found
        if: always()
        run: |
          set -o pipefail
          test -f instagram.json || exit 0
          # tee, not >>, so the result is readable in this step's log as well as
          # on the run summary page. A step that prints nothing looks broken.
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          doc = json.load(open("instagram.json"))
          print(f"Run at {doc['generated_at']}\n")

          print("| handle | posts | fields | newest post |")
          print("| --- | --- | --- | --- |")
          for entry in doc["handles"]:
              posts = entry["posts"]
              newest = max(posts, key=lambda p: p.get("date_posted") or "", default=None)
              print(
                  f"| {entry['handle']} | {len(posts)} | {len(posts[0]) if posts else 0} "
                  f"| {newest.get('url') if newest else '-'} |"
              )

          # Every post, one line each, so the log is enough to check a run.
          for entry in doc["handles"]:
              if not entry["posts"]:
                  continue
              print(f"\n### {entry['handle']}\n")
              print("| date_posted | url | likes | comments |")
              print("| --- | --- | --- | --- |")
              for post in entry["posts"]:
                  print(
                      f"| {post.get('date_posted')} | {post.get('url')} "
                      f"| {post.get('likes')} | {post.get('num_comments')} |"
                  )

          # One record in full, whatever the limit, so field values are checkable
          # without downloading the artifact.
          first = next((p for e in doc["handles"] for p in e["posts"]), None)
          if first:
              print("\n<details><summary>First record in full</summary>\n")
              print("```json")
              print(json.dumps(first, indent=2, ensure_ascii=False))
              print("```\n")
              print("</details>")
          PY
      - name: Attach instagram.json so you can download it
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instagram-json
          path: instagram.json
          if-no-files-found: warn
