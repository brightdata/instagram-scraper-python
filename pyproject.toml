[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ig-scraper"
version = "0.1.0"
description = "Scrape Instagram posts by creator handle, on the Bright Data Scraper API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["brightdata-sdk>=2.5.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/brightdata/instagram-scraper-python"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
